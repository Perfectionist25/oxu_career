{% load i18n %}

{# Макрос для рендеринга поля формы с полной обработкой ошибок #}
{% spaceless %}
<div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
        {{ field.label }}
        {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
    </label>
    
    {% if field.help_text %}
        <small class="form-text text-muted d-block mb-2">{{ field.help_text|safe }}</small>
    {% endif %}
    
    {% if field|stringformat:'s'|slice:':6' == '<input' or field|stringformat:'s'|slice:':8' == '<select' or field|stringformat:'s'|slice:':9' == '<textarea' %}
        {{ field }}
    {% else %}
        {{ field }}
    {% endif %}
    
    {% if field.errors %}
        <div class="invalid-feedback d-block mt-2">
            {% for error in field.errors %}
                <small class="d-block mb-1">
                    <i class="fas fa-exclamation-circle me-1"></i>{{ error }}
                </small>
            {% endfor %}
        </div>
    {% endif %}
</div>
{% endspaceless %}
