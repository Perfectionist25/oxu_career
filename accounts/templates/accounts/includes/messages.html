{% load i18n %}

{# Фрагмент для отображения всех сообщений #}
{% if messages %}
  <div class="alert-container mb-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show d-flex align-items-start" role="alert">
        <div class="flex-shrink-0 me-3">
          {% if message.tags == 'error' %}
            <i class="fas fa-circle-exclamation text-danger"></i>
          {% elif message.tags == 'warning' %}
            <i class="fas fa-triangle-exclamation text-warning"></i>
          {% elif message.tags == 'success' %}
            <i class="fas fa-circle-check text-success"></i>
          {% else %}
            <i class="fas fa-circle-info text-info"></i>
          {% endif %}
        </div>
        <div class="flex-grow-1">
          {{ message }}
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="{% trans 'Close' %}"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
