{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Delete Category" %}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h1 class="h4 text-danger mb-3">{% trans "Delete Category" %}</h1>
            <p class="mb-4">
                {% trans "Are you sure you want to delete category:" %}
                <strong>{{ category.name }}</strong>
            </p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">{% trans "Delete" %}</button>
                <a href="{% url 'events:admin_category_list' %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
