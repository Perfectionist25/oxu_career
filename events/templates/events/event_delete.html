{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Delete Event" %}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h1 class="h4 text-danger mb-3">{% trans "Delete Event" %}</h1>
            <p class="mb-4">
                {% trans "Are you sure you want to delete this event?" %}
                <strong>{{ event.title }}</strong>
            </p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">{% trans "Delete" %}</button>
                <a href="{% url 'events:event_detail' event.slug %}" class="btn btn-outline-secondary">
                    {% trans "Cancel" %}
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
